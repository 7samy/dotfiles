source = /home/azu/.cache/wal/colors-hyprland.conf

general {
    
    gaps_in = 6
    gaps_out = 15
    border_size = 2

    col.active_border = $color10
    col.inactive_border = $color0
    resize_on_border = false

    allow_tearing = false
}


decoration {
   rounding = 1
   rounding_power = 3

   inactive_opacity = 0.78
   active_opacity = 0.9


   
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    
    blur {
        enabled = true
        size = 7
        passes = 1
        vibrancy = 0.1696
    }
}
   windowrule = opacity 0.95 override 1.0, match:class code-oss
   windowrule = opacity 0.85 override 1.0, match:class kitty
   windowrule = opacity 0.95 override 1.0, match:class spotify
   windowrule = opacity 1.0 override 1.0, match:class gimp
   windowrule = opacity 1.0 override 1.0, match:class discord 
   windowrule = opacity 1.0 override 1.0, match:class zen
   windowrule = opacity 1.0 override 1.0, match:class org.quickshell
   windowrule = opacity 1.0 override 1.0, match:title tmux_nvim 
   

