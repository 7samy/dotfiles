
########################
#### HYPRLAND CONFIG ###
########################

#https://wiki.hypr.land/



################
### MONITORS ###
################

monitor = DP-2,2560x1440@240.00,-2560x0,1,transform,0
monitor = HDMI-A-1,1920x1080@144.00,2560x0,1,transform,0



###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun



#################
### AUTOSTART ###
#################

 exec-once = /home/azu/.config/hypr/scripts/start.sh
 exec-once = /home/azu/.config/hypr/scripts/kitty.sh

 workspace =1, monitor:DP-2,persistent:true
 workspace =3, monitor:DP-2,persistent:true
 workspace =5, monitor:DP-2,persistent:true
 workspace =7, monitor:DP-2
 workspace =9, monitor:DP-2

 workspace =2,  monitor:HDMI-A-1,persistent:true
 workspace =4,  monitor:HDMI-A-1,persistent:true
 workspace =6,  monitor:HDMI-A-1,persistent:true
 workspace =8,  monitor:HDMI-A-1
 workspace =10, monitor:HDMI-A-1

 windowrule = workspace 1, match:class kitty 
 windowrule = workspace 2, match:class brave-browser
 windowrule = workspace 4, match:class discord
 windowrule = workspace 5, match:class steam
 windowrule = workspace 6, match:class com.obsproject.Studio
 windowrule = workspace 6, match:class org.openrgb.OpenRGB
 windowrule = workspace 3, match:title nvim
 windowrule = workspace 3, match:class nvim-reload

 windowrule = fullscreen 1, match:class gamescope
 windowrule = fullscreen 1, match:class steam_app_\d+
 windowrule = workspace 7 silent,match:class gamescope
 windowrule = workspace 7 silent,match:class steam_app_\d+
 windowrule = no_blur on,match:class steam_app_\d+
 workspace = 7, border:false, rounding:false

 windowrule = match:class ^fzfwindows$, float true, size 900 600, center true
 windowrule = match:class ^swayimg$, float true, size 1600 1200, center true
 windowrule = match:class ^mpv$, float true, size 1600 1200, center true

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,10
env = HYPRCURSOR_SIZE,10

env = XDG_DATA_DIRS,$HOME/.local/share:$XDG_DATA_DIRS


#####################
### LOOK AND FEEL ###
#####################

source = /home/azu/.cache/wal/colors-hyprland.conf

general {
    
    gaps_in = 6
    gaps_out = 15
    border_size = 2

    col.active_border = $color11 
    col.inactive_border = $color1
    resize_on_border = false

    allow_tearing = false
}


decoration {
   rounding = 1
   rounding_power = 3

   inactive_opacity = 0.78
   active_opacity = 1


   layerrule = blur on, match:namespace waybar
   layerrule = ignore_alpha 0, match:namespace waybar
   layerrule = blur on, match:namespace rofi
   layerrule = ignore_alpha 0, match:namespace rofi
   
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    
    blur {
        enabled = true
        size = 7
        passes = 1
        vibrancy = 0.1696
    }
}
   windowrule = opacity 1.0 override 1.0 override, match:class brave-browser
   windowrule = opacity 0.95 override 1.0, match:class code-oss
   windowrule = opacity 0.8 override 1.0, match:class thunar
   windowrule = opacity 0.85 override 1.0, match:class kitty
   windowrule = opacity 0.9 override 1.0, match:class spotify
   windowrule = opacity 1.0 override 1.0, match:class gimp
   windowrule = opacity 1.0 override 1.0, match:class discord 

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


dwindle {
    pseudotile = true 
    preserve_split = true
}


master {
    new_status = master
}



#############
### INPUT ###
#############

input {
    kb_layout = de
    kb_options = caps:escape
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.3
    force_no_accel = true
}


device {
    name = epic-mouse-v1
    sensitivity = -0.5
}



###################
### KEYBINDINGS ###
###################

$mainMod = SUPER #"Windows Key"


bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, killactive,
bind = $mainMod, K, exit,
bind = $mainMod, B, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod SHIFT, W, exec, pkill waybar
bind = $mainMod, W, exec, /home/azu/.config/hypr/scripts/restart_waybar.sh
bind = $mainMod, S, exec, /home/azu/.config/hypr/scripts/grim_s.sh
bind = $mainMod, M, exec, /home/azu/.config/hypr/scripts/musickittyfzf.sh
bind = $mainMod, G, exec, /home/azu/.config/hypr/scripts/wallpaperkittyfzf.sh
bind = $mainMod, N, exec, /home/azu/.config/hypr/scripts/nvim.sh
bind = $mainMod, V, exec, /home/azu/.config/hypr/scripts/fzfvideo.sh

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous



##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

