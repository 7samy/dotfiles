 exec-once = /home/azu/.config/hypr/scripts/start.sh
 exec-once = /home/azu/.config/hypr/scripts/kitty.sh

 workspace =1, monitor:DP-2,persistent:true
 workspace =3, monitor:DP-2,persistent:true
 workspace =5, monitor:DP-2,persistent:true:
 workspace =7, monitor:DP-2
 workspace =9, monitor:DP-2

 workspace =2,  monitor:HDMI-A-1,persistent:true
 workspace =4,  monitor:HDMI-A-1,persistent:true
 workspace =6,  monitor:HDMI-A-1
 workspace =8,  monitor:HDMI-A-1
 workspace =10, monitor:HDMI-A-1

 windowrule = workspace 1, match:class kitty 
 windowrule = workspace 2, match:class zen	
 windowrule = workspace 4, match:class discord
 windowrule = workspace 5, match:class steam
 windowrule = workspace 6, match:class com.obsproject.Studio
 windowrule = workspace 6, match:class org.openrgb.OpenRGB
 windowrule = workspace 3, match:title nvim
 windowrule = workspace 3, match:class nvim-reload

 windowrule = fullscreen 1, match:class gamescope
 windowrule = fullscreen 1, match:class steam_app_\d+
 windowrule = workspace 7 silent,match:class gamescope
 windowrule = workspace 7 silent,match:class steam_app_\d+
 windowrule = no_blur on,match:class steam_app_\d+
 workspace = 7, border:false, rounding:false

 windowrule = match:class ^fzfwindows$, float true, size 900 600, center true
 windowrule = match:class ^swayimg$, float true, size 1600 1200, center true
 windowrule = match:class ^mpv$, float true, size 1600 1200, center true

 windowrule = suppress_event maximize, match:class .*
 windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0
 
 windowrule {
    name = zen-opacity
    match:class = ^(zen)$
    opaque = on
 }

