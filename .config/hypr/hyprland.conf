source = /home/azu/.cache/wal/colors-hyprland.conf

general {
    
    gaps_in = 6
    gaps_out = 15
    border_size = 2

    col.active_border = $color10
    col.inactive_border = $color0
    resize_on_border = false

    allow_tearing = false
}


decoration {
   rounding = 1
   rounding_power = 3

   inactive_opacity = 0.78
   active_opacity = 0.9


   layerrule = blur on, match:namespace waybar
   layerrule = ignore_alpha 0, match:namespace waybar
   layerrule = blur on, match:namespace rofi
   layerrule = ignore_alpha 0, match:namespace rofi
   
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    
    blur {
        enabled = true
        size = 7
        passes = 1
        vibrancy = 0.1696
    }
}
   windowrule = opacity 0.95 override 1.0, match:class code-oss
   windowrule = opacity 0.85 override 1.0, match:class kitty
   windowrule = opacity 0.9 override 1.0, match:class spotify
   windowrule = opacity 1.0 override 1.0, match:class gimp
   windowrule = opacity 1.0 override 1.0, match:class discord 
   windowrule = opacity 1.0 override 1.0, match:class zen
   
animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}


dwindle {
    pseudotile = true 
    preserve_split = true
}


master {
    new_status = master
}

